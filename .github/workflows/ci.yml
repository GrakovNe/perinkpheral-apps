# Every push and pull request: every application built with the SDK of the perinkpheral
# repository's main, the catalog that build makes held against the one committed - the
# modules, their sums and the least firmware each asks for - and the applications run in the
# simulator, their screens against the pictures kept in tests/.
#
# Every push to main is a release, once that passes: the next version - the last release's
# with its patch one up, or 0.1.0 - with the catalog as an archive. Devices install from the
# committed catalog/ itself; the release is what it was at that version.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: GrakovNe/perinkpheral
          path: perinkpheral
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # the tools' libraries from a cache, not from Maven Central every run: it answers 429
      - uses: gradle/actions/setup-gradle@v4
      - name: wasi-sdk
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: The tools
        run: perinkpheral/tools/perinkpheral > /dev/null
      - name: The catalog is what the applications build to
        env:
          PERINKPHERAL: ${{ github.workspace }}/perinkpheral
        run: |
          ./build.sh
          if ! git diff --exit-code --stat -- catalog; then
            echo "The committed catalog is not what the applications build to: run build.sh and commit catalog/" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain -- catalog)" ]; then
            git status --porcelain -- catalog
            echo "build.sh makes files the catalog has not committed" >&2
            exit 1
          fi
      - name: Calendar reader host tests
        run: |
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror -fsanitize=address,undefined \
            '-DHOST_IMPORT(name,...)=__VA_ARGS__' \
            -Iapps/calendar -Iperinkpheral/sdk/lib apps/calendar/test/test_ics.c apps/calendar/ics.c \
            perinkpheral/sdk/lib/app_days.c perinkpheral/sdk/lib/app_text.c -Iperinkpheral/sdk \
            -o "$RUNNER_TEMP/test_ics"
          "$RUNNER_TEMP/test_ics"
      - name: Application logic and scene restoration
        env:
          PERINKPHERAL: ${{ github.workspace }}/perinkpheral
        run: |
          tests/check-new-apps.sh
          tests/life/check-session.sh
      - name: The applications in the simulator
        run: perinkpheral/tools/perinkpheral sim-test tests
      - name: The pictures that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-pictures
          path: tests/**/*.actual.png
          if-no-files-found: ignore
      - name: The catalog, as the run's artifact
        run: (cd catalog && zip -qr ../catalog.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: catalog.zip
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')
          next=0.1.0
          if [ -n "$last" ]; then
            IFS=. read -r major minor patch <<< "$last"
            next="$major.$minor.$((patch + 1))"
          fi
          git log --no-merges --format='- %s' ${last:+v$last..}HEAD > notes.md
          gh release create "v$next" catalog.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$next" --notes-file notes.md
