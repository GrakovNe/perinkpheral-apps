# Every push and pull request: every application built with the SDK of the perinkpheral
# repository's main, the catalog that build makes held against the one committed - the
# modules, their sums and the least firmware each asks for - every application held to the
# contract by the SDK's capability checks, with its own tests, and the applications run in
# the simulator, their screens against the pictures kept in tests/.
#
# Every push to main is a release, once that passes: the next version - the last release's
# with its patch one up, or 0.1.0 - with the catalog as an archive. Devices install from the
# committed catalog/ itself; the release is what it was at that version.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  catalog:
    runs-on: [self-hosted, perinkpheral]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: Perinkpheral/perinkpheral-os
          path: perinkpheral-os
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # the tools' libraries from a cache, not from Maven Central every run: it answers 429
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: wasi-sdk
        run: |
          # Kept in the runner's tool cache: 190 MB is not fetched again by every job.
          sdk="$RUNNER_TOOL_CACHE/wasi-sdk-34.0-x86_64-linux"
          if [ ! -x "$sdk/bin/clang" ]; then
            mkdir -p "$RUNNER_TOOL_CACHE"
            fresh=$(mktemp -d -p "$RUNNER_TOOL_CACHE")
            curl --fail -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz | tar -xz -C "$fresh"
            mv -T "$fresh/wasi-sdk-34.0-x86_64-linux" "$sdk" || true
            rm -rf "$fresh"
          fi
          echo "WASI_SDK_PATH=$sdk" >> "$GITHUB_ENV"
      - name: The tools
        run: perinkpheral-os/tools/perinkpheral > /dev/null
      - name: The catalog is what the applications build to
        env:
          PERINKPHERAL: ${{ github.workspace }}/perinkpheral-os
        run: |
          ./build.sh
          if ! git diff --exit-code --stat -- catalog; then
            echo "The committed catalog is not what the applications build to: run build.sh and commit catalog/" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain -- catalog)" ]; then
            git status --porcelain -- catalog
            echo "build.sh makes files the catalog has not committed" >&2
            exit 1
          fi
      - name: The applications in the simulator
        run: |
          perinkpheral-os/tools/perinkpheral sim-test tests
      - name: The pictures that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-pictures
          path: tests/**/*.actual.png
          if-no-files-found: ignore
      # One command and no list: the SDK's capability checks on every application of the
      # folder, and whatever tests an application keeps in its own test folder. After the
      # pictures, so that a finding here does not keep them from being compared.
      - name: The applications against the contract
        if: success() || failure()
        run: perinkpheral-os/tools/perinkpheral app-check apps
      - name: The catalog, as the run's artifact
        run: (cd catalog && zip -qr ../catalog.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: catalog.zip
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')
          next=0.1.0
          if [ -n "$last" ]; then
            IFS=. read -r major minor patch <<< "$last"
            next="$major.$minor.$((patch + 1))"
          fi
          git log --no-merges --format='- %s' ${last:+v$last..}HEAD > notes.md
          gh release create "v$next" catalog.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$next" --notes-file notes.md
